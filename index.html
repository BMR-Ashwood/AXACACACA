<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бюро</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1612;
    font-family: Georgia, 'Times New Roman', serif;
    color: #e8e0d0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  #office {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: linear-gradient(180deg, #2a231b 0%, #1f1a14 40%, #16120e 100%);
  }
  #desk {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 32%;
    background: linear-gradient(180deg, #4a3826 0%, #3a2c1e 8%, #2e2318 100%);
    border-top: 4px solid #5a4530;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
  }
  .papers {
    position: absolute;
    background: #d8cfb8;
    border-radius: 2px;
    box-shadow: 1px 2px 6px rgba(0,0,0,0.5);
    transform: rotate(var(--r));
  }
  .p1 { width: 120px; height: 160px; left: 8%; bottom: 6%; --r: -4deg; }
  .p2 { width: 100px; height: 140px; left: 22%; bottom: 9%; --r: 3deg; }
  .p3 { width: 140px; height: 100px; right: 12%; bottom: 8%; --r: 5deg; }
  .p4 { width: 90px; height: 120px; right: 28%; bottom: 5%; --r: -6deg; }
  .p5 { width: 110px; height: 80px; left: 45%; bottom: 12%; --r: 2deg; }
  .lamp {
    position: absolute;
    right: 6%;
    top: 8%;
    width: 90px;
    height: 90px;
    background: radial-gradient(circle at 50% 40%, rgba(255,220,140,0.35), rgba(255,200,100,0.08) 60%, transparent 75%);
    border-radius: 50%;
    filter: blur(2px);
  }
  #visitor {
    position: absolute;
    bottom: 26%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.5s, transform 0.5s;
  }
  #visitor.away {
    opacity: 0;
    transform: translateX(-50%) translateY(40px);
  }
  .head {
    width: 90px;
    height: 110px;
    background: linear-gradient(180deg, #cfc4a8 0%, #b5a98a 100%);
    border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
    position: relative;
    box-shadow: inset -6px -8px 12px rgba(0,0,0,0.25);
  }
  .eye {
    position: absolute;
    top: 45px;
    width: 12px;
    height: 12px;
    background: #2a2018;
    border-radius: 50%;
  }
  .eye.l { left: 22px; }
  .eye.r { right: 22px; }
  .mouth {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 8px;
    border-bottom: 3px solid #6a5a48;
    border-radius: 0 0 50% 50%;
  }
  .mouth.sad { border-bottom: 3px solid #6a5a48; border-radius: 50% 50% 0 0; border-bottom: none; border-top: 3px solid #6a5a48; margin-bottom: -3px; }
  .body {
    width: 130px;
    height: 90px;
    background: linear-gradient(180deg, #6a5a48 0%, #4e4234 100%);
    border-radius: 10px 10px 0 0;
    margin-top: -8px;
  }
  #ui {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 18px 24px 22px;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.75) 30%, rgba(0,0,0,0.92) 100%);
    z-index: 10;
  }
  #speaker {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #c9a86a;
    margin-bottom: 6px;
    font-family: 'Courier New', monospace;
  }
  #line {
    font-size: 17px;
    line-height: 1.5;
    min-height: 48px;
    font-style: italic;
    color: #ede4d2;
  }
  #choices {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  button {
    background: rgba(201, 168, 106, 0.08);
    border: 1px solid rgba(201, 168, 106, 0.35);
    color: #e8ddc5;
    padding: 10px 16px;
    font-family: Georgia, serif;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover {
    background: rgba(201, 168, 106, 0.22);
    border-color: rgba(201, 168, 106, 0.8);
  }
  input[type="text"] {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(201, 168, 106, 0.35);
    color: #e8ddc5;
    padding: 10px 14px;
    font-family: Georgia, serif;
    font-size: 15px;
    border-radius: 3px;
    outline: none;
    flex: 1;
  }
  input[type="text"]:focus {
    border-color: rgba(201, 168, 106, 0.8);
  }
  #customRow {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  #customRow button {
    flex: 0 0 auto;
    text-align: center;
  }
  #customRow.hidden { display: none; }
  #stats {
    position: absolute;
    top: 14px;
    left: 18px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #8a7a62;
    letter-spacing: 1px;
    z-index: 20;
  }
  #log {
    position: absolute;
    top: 14px;
    right: 18px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #6a5a48;
    text-align: right;
    z-index: 20;
    max-width: 260px;
    line-height: 1.4;
  }
  #deskLabel {
    position: absolute;
    bottom: 34%;
    left: 18px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #5a4a38;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="office">
  <div id="stats">ДИРЕКТОР МОРРИГАН · КАБИНЕТ 14</div>
  <div id="log"></div>

  <div id="desk">
    <div class="papers p1"></div>
    <div class="papers p2"></div>
    <div class="papers p3"></div>
    <div class="papers p4"></div>
    <div class="papers p5"></div>
    <div class="lamp"></div>
  </div>
  <div id="deskLabel">стол директора · документы</div>

  <div id="visitor">
    <div class="head">
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="mouth" id="mouth"></div>
    </div>
    <div class="body"></div>
  </div>

  <div id="ui">
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="choices"></div>
    <div id="customRow" class="hidden">
      <input type="text" id="customInput" placeholder="сказать своё..." maxlength="80">
      <button id="customSend">→</button>
    </div>
  </div>
</div>

<script>
(function(){
  const employees = {
    "Джеффри": {
      sad: false,
      lines: [
        "Мистер Морриган, я закончил черновик диплома. Тема — «Влияние бюрократии на внутреннюю свободу». Проблема в том, что я не уверен, что это диплом, а не жалоба. Могу я оставить как есть?",
        "Мистер Морриган, я хотел уточнить по поводу кошки. Чонди. Она уже три дня не выходит из-под шкафа. Я думаю, это связано с тем, что я переставил шкаф. Стоит ли мне вернуть его на место?",
        "Мистер Морриган, у меня вопрос по регламенту. Если сотрудник отсутствует на рабочем месте, но при этом присутствует — как это оформлять? У нас так делает половина отдела."
      ]
    },
    "Бернадетт": {
      sad: false,
      lines: [
        "Мистер Морриган, у нас пропали ложки. Не все. Только четырнадцать. Я пересчитала. Было двадцать шесть, стало двенадцать. Я не знаю, куда они делись, но я почти уверена, что это кто-то из наших.",
        "Мистер Морриган, я нашла ложку в кофемашине. А ещё одну — в архиве. А ещё там был труп. Ну, может, не труп, но пахло очень похоже.",
        "Мистер Морриган, вы не замечали, что чайная ложка в столовой немного... другая? Как будто она смотрит. Я про ложку. Она смотрит."
      ]
    },
    "Альфред": {
      sad: false,
      lines: [
        "Мистер Морриган, у нас квартальный отчёт по третьему отделу. Цифры не сходятся на четыре процента. Что мне писать? Что мы ошиблись, или что ошиблись они?",
        "Мистер Морриган, по поводу отчёта за март. Я не уверен, что подписывать его — законно. Но я подпишу, если вы скажете.",
        "Мистер Морриган, могу я закрыть отчёт за апрель без вашей подписи? Просто вы в отпуске были. Ну, как бы были. На бумаге."
      ]
    },
    "Эвелин": {
      sad: false,
      lines: [
        "Мистер Морриган, я вам кофе. Очень сладкий. Тридцать ложек сахара. Я не считала, но мне кажется, тридцать. Может, тридцать одна. Оно почти не шевелится.",
        "Мистер Морриган, ваш кофе. Я добавила сахар. Много. Очень много. Оно теперь не совсем напиток. Скорее, десерт. Или сироп. Или... сахар с кофе.",
        "Мистер Морриган, кофе. Я попробовала его сама, и у меня слиплись зубы. Но вам, я думаю, понравится. Оно очень сладкое. Очень-очень."
      ]
    },
    "Ваня": {
      sad: false,
      lines: [
        "Мистер Морриган, а скажите честно. Я ведь не гей? Просто я об этом думаю уже третий месяц. И я не понимаю, к чему я прихожу.",
        "Мистер Морриган, а вот если человек не гей, но ему нравится, как звучит слово «эспрессо» — это нормально?",
        "Мистер Морриган, а можно я не буду отвечать на вопрос о своей ориентации в анкете? Там просто такой вопрос странный. «Уточните». Что уточнить?"
      ]
    },
    "Нетц": {
      sad: false,
      lines: [
        "Мистер Морриган, у нас по отчёту за второй квартал вопрос. В графе «прочее» у нас сумма 12 000. Что там за прочее? Я не помню, чтобы мы тратили на прочее.",
        "Мистер Морриган, по поводу отчёта. Я нашёл ошибку. В строке 47. Там написано «нет данных». Это ошибка или это данные?",
        "Мистер Морриган, если я сдаю отчёт, а его никто не читает — он считается сданным? Или считается нет?"
      ]
    },
    "Владимир": {
      sad: true,
      lines: [
        "Мистер Морриган... я... я не хочу жаловаться, но я опять без денег. Совсем. Я даже не знаю, на что я буду есть сегодня. Я не прошу, я просто говорю. Я нищий, мистер Морриган. Я нищий.",
        "Мистер Морриган, у меня опять не хватает на проезд. Я шёл пешком. Два часа. Я не жалуюсь. Просто я нищий. Вот и всё.",
        "Мистер Морриган... я не знаю, как это сказать. Мне не хватает на еду. Я не прошу. Я просто говорю, что я нищий. Потому что я нищий. Вот."
      ]
    }
  };

  const names = Object.keys(employees);
  const visitorEl = document.getElementById('visitor');
  const speakerEl = document.getElementById('speaker');
  const lineEl = document.getElementById('line');
  const choicesEl = document.getElementById('choices');
  const customRow = document.getElementById('customRow');
  const customInput = document.getElementById('customInput');
  const customSend = document.getElementById('customSend');
  const logEl = document.getElementById('log');
  const mouthEl = document.getElementById('mouth');

  let currentName = null;
  let currentLine = '';
  let busy = false;
  let logLines = [];
  let firedCount = 0;
  let spankedCount = 0;
  let shownCount = 0;

  function addLog(t){
    logLines.push(t);
    if (logLines.length > 6) logLines.shift();
    logEl.innerHTML = logLines.join('<br>');
  }

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function randomEmployee(){
    const pool = names.filter(n => n !== currentName || Math.random() < 0.25);
    return pick(pool.length ? pool : names);
  }

  function showVisitor(name){
    currentName = name;
    const data = employees[name];
    currentLine = pick(data.lines);
    mouthEl.className = 'mouth' + (data.sad ? ' sad' : '');
    visitorEl.classList.remove('away');
    speakerEl.textContent = name.toUpperCase();
    lineEl.textContent = '«' + currentLine + '»';
    addLog('→ ' + name);
    renderChoices();
  }

  function hideVisitor(){
    visitorEl.classList.add('away');
    speakerEl.textContent = '';
    lineEl.textContent = '';
    choicesEl.innerHTML = '';
    customRow.classList.add('hidden');
    currentName = null;
    currentLine = '';
  }

  function nextVisitor(delay){
    busy = true;
    hideVisitor();
    setTimeout(() => {
      busy = false;
      showVisitor(randomEmployee());
      shownCount++;
    }, delay || 900);
  }

  function renderChoices(){
    choicesEl.innerHTML = '';
    customRow.classList.add('hidden');
    customInput.value = '';

    const opts = [
      { t: 'Выслушать (молча)', act: 'listen' },
      { t: 'Дать под сраку', act: 'spank' },
      { t: 'Выгнать из кабинета', act: 'fire' },
      { t: 'Сказать своё...', act: 'custom' }
    ];

    opts.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.t;
      b.onclick = () => doAction(o.act);
      choicesEl.appendChild(b);
    });
  }

  function doAction(act){
    if (busy || !currentName) return;
    if (act === 'custom'){
      customRow.classList.remove('hidden');
      customInput.focus();
      return;
    }
    busy = true;
    let result = '';
    if (act === 'listen'){
      result = 'Вы выслушали. Ничего не произошло. Вы чувствуете себя немного хуже.';
    } else if (act === 'spank'){
      spankedCount++;
      result = 'Вы дали ' + currentName + ' под сраку. ' + currentName + ' ушёл(ла), потирая место. В кабинете стало тише.';
    } else if (act === 'fire'){
      firedCount++;
      result = 'Вы выгнали ' + currentName + '. Дверь хлопнула. На столе осталась только бумага.';
    }
    lineEl.textContent = '— ' + result;
    speakerEl.textContent = 'МИСТЕР МОРРИГАН';
    choicesEl.innerHTML = '';
    customRow.classList.add('hidden');
    addLog(result.slice(0, 60) + (result.length > 60 ? '…' : ''));
    setTimeout(() => nextVisitor(1100), 900);
  }

  customSend.onclick = function(){
    if (busy || !currentName) return;
    const text = customInput.value.trim();
    if (!text) return;
    busy = true;
    lineEl.textContent = '— Вы: «' + text + '»';
    speakerEl.textContent = 'МИСТЕР МОРРИГАН';
    choicesEl.innerHTML = '';
    customRow.classList.add('hidden');
    addLog('Вы: «' + text.slice(0, 40) + (text.length > 40 ? '…' : '') + '»');
    setTimeout(() => {
      const reactions = [
        currentName + ' моргает. Не понимает.',
        currentName + ' кивает. Кажется, тоже не понимает.',
        currentName + ' говорит: «Ясно». И уходит.',
        currentName + ' делает вид, что понял(а).',
        currentName + ' молча выходит.'
      ];
      lineEl.textContent = '— ' + pick(reactions);
      setTimeout(() => nextVisitor(1000), 900);
    }, 700);
  };

  customInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') customSend.click();
  });

  setTimeout(() => showVisitor(randomEmployee()), 600);
})();
</script>
</body>
</html>
