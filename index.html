<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кабинет Мистера Морригана</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  
  body {
    background-color: #222;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  #game {
    width: 100%;
    max-width: 500px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background-color: #e8e0d5;
    position: relative;
  }

  #room {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end; 
    align-items: center;
    overflow: hidden;
    min-height: 200px;
  }

  #desk-bg {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30%;
    background-color: #c9a87c;
    border-top: 4px solid #b8936a;
    z-index: 5;
  }

  .paper {
    position: absolute;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    z-index: 6;
  }
  .p1 { width: 50px; height: 70px; left: 10%; bottom: 5%; transform: rotate(-5deg); }
  .p2 { width: 60px; height: 40px; right: 10%; bottom: 10%; transform: rotate(8deg); }

  /* ЧАШКИ КОФЕ */
  .coffee-cup {
    position: absolute;
    bottom: 25%;
    width: 26px;
    height: 32px;
    background-color: #fff;
    border: 2px solid #ddd;
    border-radius: 0 0 10px 10px;
    box-shadow: inset -5px 0 5px rgba(0,0,0,0.1), 2px 2px 4px rgba(0,0,0,0.2);
    z-index: 7;
    animation: dropIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .coffee-cup::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px;
    height: 8px;
    background-color: #6b4c3a;
    border-radius: 50%;
    border: 2px solid #ddd;
    border-top: none;
  }
  .coffee-cup::after {
    content: '';
    position: absolute;
    top: 8px; right: -12px;
    width: 10px; height: 14px;
    border: 2px solid #ddd;
    border-left: none;
    border-radius: 0 10px 10px 0;
  }
  @keyframes dropIn {
    0% { transform: translateY(-20px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  /* МАНЕКЕН */
  #visitor {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20%;
    transition: all 0.3s ease;
  }
  
  #visitor.hidden {
    opacity: 0;
    transform: translateY(20px);
  }

  .dummy-head {
    width: 75px;
    height: 90px;
    background-color: #a0a0a0;
    border-radius: 40px 40px 20px 20px;
    box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
    margin-bottom: -5px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .face {
    font-family: monospace;
    font-size: 26px;
    color: #222;
    font-weight: bold;
    margin-top: 5px;
  }

  .dummy-body {
    width: 120px;
    height: 130px;
    background-color: #888888;
    border-radius: 20px 20px 0 0;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
  }

  .spank-anim {
    animation: shake 0.4s;
  }
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-15px) rotate(-10deg); }
    50% { transform: translateX(15px) rotate(10deg); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }

  /* Интерфейс */
  #ui {
    background-color: #ffffff;
    border-top: 2px solid #ccc;
    padding: 15px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
    z-index: 10;
  }

  #speaker {
    font-size: 14px;
    font-weight: bold;
    color: #d32f2f;
    text-transform: uppercase;
    margin-bottom: 5px;
    letter-spacing: 1px;
    min-height: 18px;
  }

  #line {
    font-size: 15px;
    color: #000;
    line-height: 1.4;
    margin-bottom: 12px;
    min-height: 60px;
    max-height: 110px;
    overflow-y: auto;
  }

  #choices {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  button {
    background-color: #f9f9f9;
    border: 2px solid #ccc;
    color: #333;
    padding: 10px;
    font-size: 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
  }

  button:active { background-color: #e0e0e0; }

  #custom-row {
    display: none;
    gap: 8px;
    margin-top: 8px;
  }
  #custom-row.active { display: flex; }

  input {
    flex: 1;
    padding: 10px;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }

  #send-btn {
    background-color: #4caf50;
    color: white;
    border: none;
    padding: 0 20px;
    width: auto;
  }
</style>
</head>
<body>

<div id="game">
  <div id="room">
    <div id="visitor" class="hidden">
      <div class="dummy-head">
        <div class="face" id="face-text">:0</div>
      </div>
      <div class="dummy-body"></div>
    </div>
    <div id="desk-bg"></div>
    <div class="paper p1"></div>
    <div class="paper p2"></div>
  </div>

  <div id="ui">
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="choices"></div>
    <div id="custom-row">
      <input type="text" id="custom-input" placeholder="Что сказать?" autocomplete="off">
      <button id="send-btn" onclick="sendCustom()">➤</button>
    </div>
  </div>
</div>

<script>
(function(){
  // СЕТТИНГ 1920-х ГОДОВ, ОГАЙО, БЮРО МАГИЧЕСКОГО РЕГУЛИРОВАНИЯ
  const characters = {
    "Джеффри": {
      lines: [
        "Мистер Морриган, я закончил черновик диплома. Тема — «Влияние бюрократии на внутреннюю свободу». Проблема в том, что я не уверен, что это диплом, а не жалоба. Могу я оставить как есть?",
        "Мистер Морриган, я хотел уточнить по поводу кошки. Чонди. Она уже три дня не выходит из-под шкафа. Я думаю, это связано с тем, что я переставил шкаф. Стоит ли мне вернуть его на место?",
        "Мистер Морриган, а можно мне получить лицензию второй категории? Я обещаю не использовать магию во вред. Ну, почти не использовать.",
        "Мистер Морриган, я читал трактат Мэйхью о том, что магия состоит из атомов. Если это так, то можно ли расщепить атом магии? Или это будет нарушением закона о сохранении энергии?"
      ]
    },
    "Бернадетт": {
      lines: [
        "Мистер Морриган, у нас опять пропали ложки. Не все. Только четырнадцать. Я пересчитала. А ещё я нашла ложку в архиве. И там был труп. Ну, может, не труп, но пахло очень похоже.",
        "Мистер Морриган, вы не замечали, что чайная ложка в столовой немного... другая? Как будто она смотрит. Я про ложку. Она смотрит.",
        "Мистер Морриган, я принесла вам новости о Бусинке. Мой паук-фамильяр сплёл паутину прямо над вашим сейфом. Это очень мило с его стороны, правда?",
        "Мистер Морриган, а Бусинка сегодня съел муху, которая была размером с мою ладонь. Я думаю, он становится сильнее. Если он вырастет до размеров собаки, мне нужно будет оформить ему отдельную лицензию?"
      ]
    },
    "Альфред": {
      lines: [
        "Мистер Морриган, я старший инспектор, и у нас проблема. Никто не выехал на адрес к мужчине с четвёртой магической лицензией. Он угрожает жалобой в министерство.",
        "Мистер Морриган, по третьей категории лицензий. К нам поступил сигнал, что кто-то из бараков занимается тёмными практиками без разрешения. Нам отправлять отряд или просто выписать штраф?",
        "Мистер Морриган, мы можем оштрафовать мага с третьей лицензией за то, что у него метла летает быстрее положенного? Или это нарушение ПДД, а не магии?",
        "Мистер Морриган, после смерти Грегора Менделя прошло уже два месяца, а бумаги по протоколу «Гармония» всё ещё не подписаны. Что делать с нелегалами?"
      ]
    },
    "Эвелин": {
      isEvelyn: true,
      lines: [
        "Мистер Морриган, я вам кофе. Очень сладкий. Тридцать ложек сахара. Я не считала, но мне кажется, тридцать. Может, тридцать одна. Оно почти не шевелится.",
        "Мистер Морриган, ваш кофе. Я добавила сахар. Много. Очень много. Оно теперь не совсем напиток. Скорее, десерт. Или сироп. Или... сахар с кофе.",
        "Мистер Морриган, кофе. Я попробовала его сама, и у меня слиплись зубы. Но вам, я думаю, понравится. Оно очень сладкое. Очень-очень. Я добавила туда немного магии для бодрости."
      ]
    },
    "Ваня": {
      lines: [
        "Мистер Морриган, а скажите честно. Я ведь не гей? Просто я об этом думаю уже третий месяц. И я не понимаю, к чему я прихожу. Может, это мой дар так влияет?",
        "Мистер Морриган, а вот если человек не гей, но ему нравится, как звучит слово «эспрессо» — это нормально? Или мне нужно сдать лицензию?",
        "Мистер Морриган, а можно я не буду отвечать на вопрос о своей ориентации в анкете? Там просто такой вопрос странный. «Уточните». Что уточнить?"
      ]
    },
    "Нетц": {
      isNets: true,
      lines: [
        "Мистер Морриган, я по поводу отчёта за март... Вы не знаете, почему сотрудники из бухгалтерии так странно на меня смотрят? Кажется, они меня обсуждают. Я же ваш зам, в конце концов.",
        "Мистер Морриган, у меня ошибка в строке 47. Там написано «нет данных» у мага с четвёртой категорией. Это ошибка или он правда не зарегистрирован? И почему все шепчутся за моей спиной?",
        "Мистер Морриган, я сдал отчёт по проверкам, а его никто не читает. Может, я вообще зря работаю? И почему все шепчутся за моей спиной? Из-за того, что вы назначили меня замом?"
      ]
    },
    "Владимир": {
      isVisitor: true,
      lines: [
        "Мистер Морриган... я... я не хочу жаловаться, но 15 долларов за лицензию — это грабёж! Я не прошу, я просто говорю. Я нищий, мистер Морриган. Сделайте скидку, умоляю. Я же не использую магию во вред!",
        "Мистер Морриган, у меня опять не хватает на продление лицензии. Пятнадцать долларов! Я шёл пешком. Два часа. Я не жалуюсь. Просто я нищий. Вот и всё.",
        "Мистер Морриган... я не знаю, как это сказать. Мне не хватает на еду, потому что я отдал последнее за эту вашу лицензию. Я не прошу. Я просто говорю, что я нищий. И эти ваши правила дурацкие."
      ]
    },
    "Дима": {
      isDima: true,
      isVisitor: true,
      lines: [
        "Слышь, Морриган. Иди нахуй со своими правилами и лицензиями. У меня всё.",
        "Ты чё, самый умный тут? Иди нахуй, я сказал. Твой «Ordo ex Chao» уже в печёнках сидит.",
        "Морриган, ты заебал. Иди нахуй. Я не буду платить твои 15 баксов, хоть ты тресни."
      ]
    }
  };

  const names = Object.keys(characters);
  
  const visitorEl = document.getElementById('visitor');
  const faceTextEl = document.getElementById('face-text');
  const speakerEl = document.getElementById('speaker');
  const lineEl = document.getElementById('line');
  const choicesEl = document.getElementById('choices');
  const customRow = document.getElementById('custom-row');
  const customInput = document.getElementById('custom-input');
  const roomEl = document.getElementById('room');

  let currentName = null;
  let currentSpankCount = 0; // Счётчик шлепков для текущего персонажа
  let busy = false;
  let lastTwo = [];

  let audioCtx;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    try {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.05);
      } 
      else if (type === 'spank') {
        const bufferSize = audioCtx.sampleRate * 0.1;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start(now);
      } 
      else if (type === 'sad') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.6);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.6);
      }
      else if (type === 'angry') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.2);
      }
    } catch(e) {}
  }

  function getRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function getFace(name) {
    const faces = {
      "Джеффри": [":0", ":O", ":|"],
      "Бернадетт": [":P", ":3", ";P"],
      "Альфред": [":|", ":-|", ":Z"],
      "Эвелин": [":3", "^_^", "UwU"],
      "Ваня": [":(", ":/", ":c"],
      "Нетц": [":'(", "T_T", "._."],
      "Владимир": ["T_T", ";-;", "ToT"],
      "Дима": [">:(", ">:|", "ಠ_ಠ"]
    };
    return getRandom(faces[name] || [":0"]);
  }

  function addCoffeeCup() {
    const currentCups = document.querySelectorAll('.coffee-cup').length;
    if (currentCups > 15) return;

    const cup = document.createElement('div');
    cup.className = 'coffee-cup';
    const leftPos = 5 + Math.random() * 25;
    cup.style.left = leftPos + '%';
    const bottomOffset = Math.random() * 10;
    cup.style.bottom = (20 + bottomOffset) + '%';
    cup.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
    roomEl.appendChild(cup);
  }

  function spawnDummy() {
    busy = false;
    currentSpankCount = 0; // Сбрасываем счетчик шлепков для нового гостя
    
    let availableNames = names.filter(name => !lastTwo.includes(name));
    if (availableNames.length === 0) availableNames = names;
    
    currentName = getRandom(availableNames);
    
    lastTwo.push(currentName);
    if (lastTwo.length > 2) lastTwo.shift();

    const charData = characters[currentName];
    const dialogue = getRandom(charData.lines);
    
    visitorEl.classList.remove('hidden');
    faceTextEl.textContent = getFace(currentName);
    
    speakerEl.textContent = currentName;
    lineEl.textContent = '«' + dialogue + '»';
    lineEl.scrollTop = 0;

    if (charData.isEvelyn) addCoffeeCup();
    
    renderChoices();
  }

  function hideDummy() {
    visitorEl.classList.add('hidden');
  }

  function renderChoices() {
    choicesEl.innerHTML = '';
    customRow.classList.remove('active');
    customInput.value = '';

    const options = [
      { text: 'Выслушать (молча)', action: 'listen' },
      { text: 'Дать под сраку', action: 'spank' },
      { text: 'Выгнать из кабинета', action: 'fire' },
      { text: 'Сказать своё...', action: 'custom' }
    ];

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.textContent = opt.text;
      btn.onclick = () => handleAction(opt.action);
      choicesEl.appendChild(btn);
    });
  }

  function handleAction(action) {
    if (busy || !currentName) return;
    initAudio();

    if (action === 'custom') {
      playSound('click');
      customRow.classList.add('active');
      customInput.focus();
      return;
    }

    const charData = characters[currentName];
    choicesEl.innerHTML = '';
    
    // ВЫСЛУШАТЬ
    if (action === 'listen') {
      busy = true;
      playSound('sad');
      
      if (charData.isVisitor) {
        lineEl.textContent = currentName + ' разворачивается и уходит, не дождавшись вашей реакции.';
      } else {
        lineEl.textContent = 'Вы молча киваете. Сотрудник уходит, так и не поняв, что вы его не слушали.';
      }
      
      speakerEl.textContent = '';
      setTimeout(nextVisitor, 3000); 
    } 
    
    // ШЛЕПОК (ИЗМЕНЕНО)
    else if (action === 'spank') {
      playSound('spank');
      currentSpankCount++;
      visitorEl.classList.add('spank-anim');
      
      if (charData.isDima) {
        busy = false; 
        speakerEl.textContent = 'ДИМА';
        lineEl.textContent = '— Дима посмотрел на вас. Он не ушёл. Он сказал: «Слышь, ты чё, долбанулся? Иди нахуй».';
        setTimeout(() => {
          visitorEl.classList.remove('spank-anim');
          renderChoices(); 
        }, 800);
      } 
      else if (currentSpankCount < 3) {
        // Первые два раза не уходят
        busy = false;
        speakerEl.textContent = currentName;
        lineEl.textContent = '— ' + currentName + ' ойкает. «Мистер Морриган, что вы делаете? Это же насилие!»';
        setTimeout(() => {
          visitorEl.classList.remove('spank-anim');
          renderChoices(); 
        }, 800);
      } 
      else {
        // На третий раз уходят
        busy = true;
        speakerEl.textContent = '';
        lineEl.textContent = 'Вы дали ' + currentName + ' под сраку в третий раз. ' + currentName + ' больше не выдерживает, всхлипывает и убегает.';
        setTimeout(() => { visitorEl.classList.remove('spank-anim'); nextVisitor(); }, 3500);
      }
    } 
    
    // ВЫГНАТЬ
    else if (action === 'fire') {
      if (charData.isDima) {
        playSound('angry');
        lineEl.textContent = 'Вы попытались выгнать Диму. В ответ он вам набил ебало. Вы ахуели. Дима ушёл сам.';
        speakerEl.textContent = '';
        busy = true;
        setTimeout(() => nextVisitor(), 4000); 
      } else {
        playSound('click');
        busy = true;
        speakerEl.textContent = '';
        lineEl.textContent = 'Вы указываете ' + currentName + ' на дверь. Дверь хлопает.';
        setTimeout(nextVisitor, 3000);
      }
    }
  }

  // УМНЫЙ (псевдо-ИИ) ОТВЕТ НА ПОЛЬЗОВАТЕЛЬСКИЙ ВВОД
  window.sendCustom = function() {
    if (busy || !currentName) return;
    const text = customInput.value.trim();
    if (!text) return;
    
    initAudio();
    playSound('click');
    busy = true;
    customRow.classList.remove('active');
    choicesEl.innerHTML = '';
    
    lineEl.textContent = '— Вы: «' + text + '»';
    speakerEl.textContent = '';
    
    const lowerText = text.toLowerCase();
    const charData = characters[currentName];
    
    setTimeout(() => {
      let response = '';
      
      if (charData.isDima) {
        playSound('angry');
        response = '— Дима: «Иди нахуй, я сказал».';
      } else {
        playSound('sad');
        
        // Анализ ключевых слов
        if (lowerText.includes('кофе') || lowerText.includes('сладк')) {
          response = currentName + ' моргает. «Но, мистер Морриган, я же старалась...»';
        } 
        else if (lowerText.includes('лиценз') || lowerText.includes('деньг') || lowerText.includes('15')) {
          if (charData.isVisitor) {
            response = '— ' + currentName + ': «Вот именно! 15 долларов за бумажку! Это грабёж!»';
          } else {
            response = currentName + ' поправляет галстук. «Лицензии — это основа порядка, сэр. Ordo ex Chao».';
          }
        }
        else if (lowerText.includes('паук') || lowerText.includes('бусин')) {
          response = '— ' + currentName + ': «Бусинка — самый милый фамильяр! Он не опасен, он просто любит мух и ваши документы».';
        }
        else if (lowerText.includes('нищ') || lowerText.includes('бедн')) {
          if (currentName === 'Владимир') {
            response = '— Владимир: «Да! Да! Я нищий! Вы наконец-то поняли меня, мистер Морриган!»';
          } else {
            response = currentName + ' сочувственно вздыхает. «Бедный Владимир. Но 15 долларов — это стандартный тариф».';
          }
        }
        else if (lowerText.includes('увол') || lowerText.includes('выгн')) {
          response = currentName + ' бледнеет. «Мистер Морриган, пожалуйста, не надо! Я исправлюсь!»';
        }
        else if (lowerText.includes('магия') || lowerText.includes('дар')) {
          response = currentName + ' кивает. «Мой дар — это моя суть. Бюро помогает нам не сойти с ума».';
        }
        else {
          // Рандомные ответы, если ничего не совпало
          const fallbacks = [
            currentName + ' смотрит на вас пустым взглядом, явно не понимая.',
            currentName + ' неуверенно улыбается: «Мистер Морриган, я не совсем понял вашу мысль».',
            currentName + ' кашляет в кулак. «Да, сэр. Как скажете, сэр».',
            currentName + ' кивает с умным видом, хотя в глазах пустота.'
          ];
          response = getRandom(fallbacks);
        }
      }
      
      lineEl.textContent = response;
      setTimeout(nextVisitor, 3500);
    }, 1000); 
  };

  function nextVisitor() {
    hideDummy();
    setTimeout(() => {
      spawnDummy();
    }, 800); 
  }

  setTimeout(spawnDummy, 500);

})();
</script>
</body>
</html>
