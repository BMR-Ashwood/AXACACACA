<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кабинет Мистера Морригана</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  
  body {
    background-color: #f0f0f0; /* Светлый фон */
    height: 100vh;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  #game {
    width: 100%;
    max-width: 500px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background-color: #e8e0d5; /* Светлая стена */
    position: relative;
  }

  /* Верхняя часть - комната */
  #room {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden;
    padding-bottom: 20px;
  }

  /* Стол на фоне */
  #desk-bg {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 35%;
    background-color: #c9a87c; /* Светлое дерево */
    border-top: 4px solid #b8936a;
    z-index: 1;
  }

  /* Бумаги */
  .paper {
    position: absolute;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
  }
  .p1 { width: 50px; height: 70px; left: 10%; bottom: 5%; transform: rotate(-5deg); z-index: 2; }
  .p2 { width: 60px; height: 40px; right: 10%; bottom: 10%; transform: rotate(8deg); z-index: 2; }

  /* СЕРЫЙ БЕЗЛИКИЙ МАНЕКЕН */
  #visitor {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.3s ease;
  }
  
  #visitor.hidden {
    opacity: 0;
    transform: translateY(20px);
  }

  .dummy-head {
    width: 80px;
    height: 100px;
    background-color: #a0a0a0; /* Серый */
    border-radius: 40px 40px 30px 30px;
    box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
    margin-bottom: -5px;
  }

  .dummy-body {
    width: 130px;
    height: 120px;
    background-color: #888888; /* Темно-серый */
    border-radius: 20px 20px 0 0;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
  }

  /* Эффекты */
  .spank-anim {
    animation: shake 0.4s;
  }
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-5deg); }
    50% { transform: translateX(10px) rotate(5deg); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }

  /* Нижняя часть - интерфейс */
  #ui {
    background-color: #ffffff;
    border-top: 2px solid #ccc;
    padding: 15px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
    z-index: 10;
  }

  #speaker {
    font-size: 12px;
    font-weight: bold;
    color: #d32f2f;
    text-transform: uppercase;
    margin-bottom: 5px;
    letter-spacing: 1px;
  }

  #line {
    font-size: 16px;
    color: #000; /* Черный текст */
    line-height: 1.4;
    margin-bottom: 15px;
    min-height: 60px;
    max-height: 120px;
    overflow-y: auto;
  }

  #choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  button {
    background-color: #f9f9f9;
    border: 2px solid #ccc;
    color: #333;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.1s;
  }

  button:active {
    background-color: #e0e0e0;
  }

  #custom-row {
    display: none;
    gap: 8px;
    margin-top: 8px;
  }
  #custom-row.active { display: flex; }

  input {
    flex: 1;
    padding: 10px;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
  }

  #send-btn {
    background-color: #4caf50;
    color: white;
    border: none;
    padding: 0 20px;
  }

</style>
</head>
<body>

<div id="game">
  <div id="room">
    <div id="desk-bg"></div>
    <div class="paper p1"></div>
    <div class="paper p2"></div>
    
    <div id="visitor" class="hidden">
      <div class="dummy-head"></div>
      <div class="dummy-body"></div>
    </div>
  </div>

  <div id="ui">
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="choices"></div>
    <div id="custom-row">
      <input type="text" id="custom-input" placeholder="Что сказать?" autocomplete="off">
      <button id="send-btn" onclick="sendCustom()">➤</button>
    </div>
  </div>
</div>

<script>
(function(){
  // БАЗА ПЕРСОНАЖЕЙ
  const characters = {
    "Джеффри": [
      "Мистер Морриган, я закончил черновик диплома. Тема — «Влияние бюрократии на внутреннюю свободу». Проблема в том, что я не уверен, что это диплом, а не жалоба. Могу я оставить как есть?",
      "Мистер Морриган, я хотел уточнить по поводу кошки. Чонди. Она уже три дня не выходит из-под шкафа. Я думаю, это связано с тем, что я переставил шкаф. Стоит ли мне вернуть его на место?",
      "Мистер Морриган, у меня вопрос по регламенту. Если сотрудник отсутствует на рабочем месте, но при этом присутствует — как это оформлять? У нас так делает половина отдела."
    ],
    "Бернадетт": [
      "Мистер Морриган, у нас пропали ложки. Не все. Только четырнадцать. Я пересчитала. Было двадцать шесть, стало двенадцать. Я не знаю, куда они делись, но я почти уверена, что это кто-то из наших.",
      "Мистер Морриган, я нашла ложку в кофемашине. А ещё одну — в архиве. А ещё там был труп. Ну, может, не труп, но пахло очень похоже.",
      "Мистер Морриган, вы не замечали, что чайная ложка в столовой немного... другая? Как будто она смотрит. Я про ложку. Она смотрит."
    ],
    "Альфред": [
      "Мистер Морриган, у нас квартальный отчёт по третьему отделу. Цифры не сходятся на четыре процента. Что мне писать? Что мы ошиблись, или что ошиблись они?",
      "Мистер Морриган, по поводу отчёта за март. Я не уверен, что подписывать его — законно. Но я подпишу, если вы скажете.",
      "Мистер Морриган, могу я закрыть отчёт за апрель без вашей подписи? Просто вы в отпуске были. Ну, как бы были. На бумаге."
    ],
    "Эвелин": [
      "Мистер Морриган, я вам кофе. Очень сладкий. Тридцать ложек сахара. Я не считала, но мне кажется, тридцать. Может, тридцать одна. Оно почти не шевелится.",
      "Мистер Морриган, ваш кофе. Я добавила сахар. Много. Очень много. Оно теперь не совсем напиток. Скорее, десерт. Или сироп. Или... сахар с кофе.",
      "Мистер Морриган, кофе. Я попробовала его сама, и у меня слиплись зубы. Но вам, я думаю, понравится. Оно очень сладкое. Очень-очень."
    ],
    "Ваня": [
      "Мистер Морриган, а скажите честно. Я ведь не гей? Просто я об этом думаю уже третий месяц. И я не понимаю, к чему я прихожу.",
      "Мистер Морриган, а вот если человек не гей, но ему нравится, как звучит слово «эспрессо» — это нормально?",
      "Мистер Морриган, а можно я не буду отвечать на вопрос о своей ориентации в анкете? Там просто такой вопрос странный. «Уточните». Что уточнить?"
    ],
    "Нетц": [
      "Мистер Морриган, у нас по отчёту за второй квартал вопрос. В графе «прочее» у нас сумма 12 000. Что там за прочее? Я не помню, чтобы мы тратили на прочее.",
      "Мистер Морриган, по поводу отчёта. Я нашёл ошибку. В строке 47. Там написано «нет данных». Это ошибка или это данные?",
      "Мистер Морриган, если я сдаю отчёт, а его никто не читает — он считается сданным? Или считается нет?"
    ],
    "Владимир": [
      "Мистер Морриган... я... я не хочу жаловаться, но я опять без денег. Совсем. Я даже не знаю, на что я буду есть сегодня. Я не прошу, я просто говорю. Я нищий, мистер Морриган. Я нищий.",
      "Мистер Морриган, у меня опять не хватает на проезд. Я шёл пешком. Два часа. Я не жалуюсь. Просто я нищий. Вот и всё.",
      "Мистер Морриган... я не знаю, как это сказать. Мне не хватает на еду. Я не прошу. Я просто говорю, что я нищий. Потому что я нищий. Вот."
    ]
  };

  const names = Object.keys(characters);
  
  // ЭЛЕМЕНТЫ DOM
  const visitorEl = document.getElementById('visitor');
  const speakerEl = document.getElementById('speaker');
  const lineEl = document.getElementById('line');
  const choicesEl = document.getElementById('choices');
  const customRow = document.getElementById('custom-row');
  const customInput = document.getElementById('custom-input');

  let currentName = null;
  let busy = false;

  // ЗВУКИ (Web Audio)
  let audioCtx;
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      
      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'spank') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'fire') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      }
    } catch(e) {}
  }

  function getRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function spawnDummy() {
    busy = false;
    currentName = getRandom(names);
    const dialogue = getRandom(characters[currentName]);
    
    visitorEl.classList.remove('hidden');
    speakerEl.textContent = currentName;
    lineEl.textContent = '«' + dialogue + '»';
    
    renderChoices();
  }

  function hideDummy() {
    visitorEl.classList.add('hidden');
  }

  function renderChoices() {
    choicesEl.innerHTML = '';
    customRow.classList.remove('active');
    customInput.value = '';

    const options = [
      { text: 'Выслушать (молча)', action: 'listen' },
      { text: 'Дать под сраку', action: 'spank' },
      { text: 'Выгнать из кабинета', action: 'fire' },
      { text: 'Сказать своё...', action: 'custom' }
    ];

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.textContent = opt.text;
      btn.onclick = () => handleAction(opt.action);
      choicesEl.appendChild(btn);
    });
  }

  function handleAction(action) {
    if (busy || !currentName) return;
    playSound('click');

    if (action === 'custom') {
      customRow.classList.add('active');
      customInput.focus();
      return;
    }

    busy = true;
    choicesEl.innerHTML = '';
    
    if (action === 'listen') {
      lineEl.textContent = 'Вы молча киваете. Сотрудник уходит, так и не поняв, что вы его не слушали.';
      speakerEl.textContent = 'МИСТЕР МОРРИГАН';
      setTimeout(nextVisitor, 1500);
    } 
    else if (action === 'spank') {
      playSound('spank');
      visitorEl.classList.add('spank-anim');
      lineEl.textContent = 'Вы дали ' + currentName + ' под сраку. ' + currentName + ' подпрыгивает и убегает.';
      speakerEl.textContent = 'МИСТЕР МОРРИГАН';
      setTimeout(() => { visitorEl.classList.remove('spank-anim'); nextVisitor(); }, 600);
    } 
    else if (action === 'fire') {
      playSound('fire');
      lineEl.textContent = 'Вы указываете ' + currentName + ' на дверь. Дверь хлопает.';
      speakerEl.textContent = 'МИСТЕР МОРРИГАН';
      setTimeout(nextVisitor, 1000);
    }
  }

  // Отправка своего текста
  window.sendCustom = function() {
    if (busy || !currentName) return;
    const text = customInput.value.trim();
    if (!text) return;
    
    playSound('click');
    busy = true;
    customRow.classList.remove('active');
    choicesEl.innerHTML = '';
    
    lineEl.textContent = '— Вы: «' + text + '»';
    speakerEl.textContent = 'МИСТЕР МОРРИГАН';
    
    setTimeout(() => {
      const reactions = [
        currentName + ' смотрит на вас пустым взглядом.',
        currentName + ' кивает, ничего не понимая.',
        currentName + ' разворачивается и уходит.',
        currentName + ' говорит: «Ясно».'
      ];
      lineEl.textContent = '— ' + getRandom(reactions);
      setTimeout(nextVisitor, 1500);
    }, 1000);
  };

  function nextVisitor() {
    hideDummy();
    setTimeout(() => {
      spawnDummy();
    }, 500);
  }

  // Инициализация
  setTimeout(spawnDummy, 500);

})();
</script>
</body>
</html>
