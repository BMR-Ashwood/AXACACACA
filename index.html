<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кабинет Мистера Морригана</title>
<!-- Подключаем Puter.js для работы с ИИ прямо в браузере -->
<script src="https://js.puter.com/v2/"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  
  body {
    background-color: #222;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  #game {
    width: 100%;
    max-width: 500px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background-color: #e8e0d5;
    position: relative;
  }

  #room {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end; 
    align-items: center;
    overflow: hidden;
    min-height: 200px;
  }

  #desk-bg {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30%;
    background-color: #c9a87c;
    border-top: 4px solid #b8936a;
    z-index: 5;
  }

  .paper {
    position: absolute;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    z-index: 6;
  }
  .p1 { width: 50px; height: 70px; left: 10%; bottom: 5%; transform: rotate(-5deg); }
  .p2 { width: 60px; height: 40px; right: 10%; bottom: 10%; transform: rotate(8deg); }

  .coffee-cup {
    position: absolute;
    bottom: 25%;
    width: 26px;
    height: 32px;
    background-color: #fff;
    border: 2px solid #ddd;
    border-radius: 0 0 10px 10px;
    box-shadow: inset -5px 0 5px rgba(0,0,0,0.1), 2px 2px 4px rgba(0,0,0,0.2);
    z-index: 7;
    animation: dropIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .coffee-cup::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px;
    height: 8px;
    background-color: #6b4c3a;
    border-radius: 50%;
    border: 2px solid #ddd;
    border-top: none;
  }
  .coffee-cup::after {
    content: '';
    position: absolute;
    top: 8px; right: -12px;
    width: 10px; height: 14px;
    border: 2px solid #ddd;
    border-left: none;
    border-radius: 0 10px 10px 0;
  }
  @keyframes dropIn {
    0% { transform: translateY(-20px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  #visitor {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20%;
    transition: all 0.3s ease;
  }
  
  #visitor.hidden {
    opacity: 0;
    transform: translateY(20px);
  }

  .dummy-head {
    width: 75px;
    height: 90px;
    background-color: #a0a0a0;
    border-radius: 40px 40px 20px 20px;
    box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
    margin-bottom: -5px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .face {
    font-family: monospace;
    font-size: 26px;
    color: #222;
    font-weight: bold;
    margin-top: 5px;
  }

  .dummy-body {
    width: 120px;
    height: 130px;
    background-color: #888888;
    border-radius: 20px 20px 0 0;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
  }

  .spank-anim {
    animation: shake 0.4s;
  }
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-15px) rotate(-10deg); }
    50% { transform: translateX(15px) rotate(10deg); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }

  #ui {
    background-color: #ffffff;
    border-top: 2px solid #ccc;
    padding: 15px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
    z-index: 10;
  }

  #speaker {
    font-size: 14px;
    font-weight: bold;
    color: #d32f2f;
    text-transform: uppercase;
    margin-bottom: 5px;
    letter-spacing: 1px;
    min-height: 18px;
  }

  #line {
    font-size: 15px;
    color: #000;
    line-height: 1.4;
    margin-bottom: 12px;
    min-height: 60px;
    max-height: 110px;
    overflow-y: auto;
  }

  #choices {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  button {
    background-color: #f9f9f9;
    border: 2px solid #ccc;
    color: #333;
    padding: 10px;
    font-size: 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
  }

  button:active { background-color: #e0e0e0; }
  
  /* Индикатор загрузки ИИ */
  .typing {
    display: inline-block;
    font-style: italic;
    color: #888;
  }
  .typing::after {
    content: '...';
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }

  #custom-row {
    display: none;
    gap: 8px;
    margin-top: 8px;
  }
  #custom-row.active { display: flex; }

  input {
    flex: 1;
    padding: 10px;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }

  #send-btn {
    background-color: #4caf50;
    color: white;
    border: none;
    padding: 0 20px;
    width: auto;
  }
</style>
</head>
<body>

<div id="game">
  <div id="room">
    <div id="visitor" class="hidden">
      <div class="dummy-head">
        <div class="face" id="face-text">:0</div>
      </div>
      <div class="dummy-body"></div>
    </div>
    <div id="desk-bg"></div>
    <div class="paper p1"></div>
    <div class="paper p2"></div>
  </div>

  <div id="ui">
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="choices"></div>
    <div id="custom-row">
      <input type="text" id="custom-input" placeholder="Что сказать?" autocomplete="off">
      <button id="send-btn" onclick="sendCustom()">➤</button>
    </div>
  </div>
</div>

<script>
(function(){
  // Характеры и изначальные фразы для контекста ИИ
  const characters = {
    "Джеффри": {
      desc: "Молодой сотрудник Бюро. Немного неуверенный в себе, пишет диплом о влиянии бюрократии. У него есть кошка Чонди. Говорит вежливо, называет начальника 'Мистер Морриган'.",
      lines: [
        "Мистер Морриган, я закончил черновик диплома. Тема — «Влияние бюрократии на внутреннюю свободу». Проблема в том, что я не уверен, что это диплом, а не жалоба.",
        "Мистер Морриган, я хотел уточнить по поводу кошки. Чонди. Она уже три дня не выходит из-под шкафа.",
        "Мистер Морриган, а можно мне получить лицензию второй категории? Я обещаю не использовать магию во вред."
      ]
    },
    "Бернадетт": {
      desc: "Сотрудница Бюро. Странная, постоянно теряет ложки и находит трупы в архиве. У неё есть паук-фамильяр по имени Бусинка, которого она обожает. Начальника называет 'Мистер Морриган'.",
      lines: [
        "Мистер Морриган, у нас опять пропали ложки. Не все. Только четырнадцать. А ещё я нашла ложку в архиве. И там был труп.",
        "Мистер Морриган, вы не замечали, что чайная ложка в столовой немного... другая? Как будто она смотрит.",
        "Мистер Морриган, я принесла вам новости о Бусинке. Мой паук-фамильяр сплёл паутину прямо над вашим сейфом."
      ]
    },
    "Альфред": {
      desc: "Старший инспектор Бюро. Серьезный, следует правилам, переживает о лицензиях (4-й и 3-й категории), выездах на адреса и темных практиках в бараках. Начальника называет 'Мистер Морриган'.",
      lines: [
        "Мистер Морриган, я старший инспектор. Никто не выехал на адрес к мужчине с четвёртой магической лицензией.",
        "Мистер Морриган, по третьей категории лицензий. К нам поступил сигнал, что кто-то из бараков занимается тёмными практиками.",
        "Мистер Морриган, после смерти Грегора Менделя прошло уже два месяца, а бумаги по протоколу «Гармония» всё ещё не подписаны."
      ]
    },
    "Эвелин": {
      desc: "Сотрудница Бюро, приносит кофе. Её кофе невероятно, приторно сладкий (30 ложек сахара). Добрая, но немного наивная. Начальника называет 'Мистер Морриган'.",
      isEvelyn: true,
      lines: [
        "Мистер Морриган, я вам кофе. Очень сладкий. Тридцать ложек сахара. Оно почти не шевелится.",
        "Мистер Морриган, ваш кофе. Я добавила сахар. Много. Очень много. Оно теперь не совсем напиток. Скорее, десерт.",
        "Мистер Морриган, кофе. Я попробовала его сама, и у меня слиплись зубы. Но вам, я думаю, понравится."
      ]
    },
    "Ваня": {
      desc: "Сотрудник Бюро, который постоянно задается вопросом о своей ориентации (гей или нет) и ищет подтверждения. Начальника называет 'Мистер Морриган'.",
      lines: [
        "Мистер Морриган, а скажите честно. Я ведь не гей? Просто я об этом думаю уже третий месяц.",
        "Мистер Морриган, а вот если человек не гей, но ему нравится, как звучит слово «эспрессо» — это нормально?",
        "Мистер Морриган, а можно я не буду отвечать на вопрос о своей ориентации в анкете?"
      ]
    },
    "Нетц": {
      desc: "Заместитель директора Бюро. Нервный, жалуется, что сотрудники из бухгалтерии шепчутся за его спиной. Ищет ошибки в отчетах. Начальника называет 'Мистер Морриган'.",
      lines: [
        "Мистер Морриган, я по поводу отчёта за март... Вы не знаете, почему сотрудники из бухгалтерии так странно на меня смотрят?",
        "Мистер Морриган, у меня ошибка в строке 47. Там написано «нет данных» у мага с четвёртой категорией.",
        "Мистер Морриган, я сдал отчёт по проверкам, а его никто не читает. Может, я вообще зря работаю?"
      ]
    },
    "Владимир": {
      desc: "Нищий посетитель. Постоянно ноет, что у него нет денег, что 15 долларов за лицензию — это грабеж. Очень жалкий, но не агрессивный. Начальника называет 'Мистер Морриган'.",
      isVisitor: true,
      lines: [
        "Мистер Морриган... я... я не хочу жаловаться, но 15 долларов за лицензию — это грабёж! Сделайте скидку, умоляю.",
        "Мистер Морриган, у меня опять не хватает на продление лицензии. Пятнадцать долларов! Я шёл пешком. Два часа.",
        "Мистер Морриган... я не знаю, как это сказать. Мне не хватает на еду, потому что я отдал последнее за эту вашу лицензию."
      ]
    },
    "Дима": {
      desc: "Агрессивный посетитель. Грубиян, использует мат (например, 'иди нахуй'). Ненавидит Бюро, правила и лицензии. Не боится директора и может ответить агрессией на агрессию.",
      isDima: true,
      isVisitor: true,
      lines: [
        "Слышь, Морриган. Иди нахуй со своими правилами и лицензиями. У меня всё.",
        "Ты чё, самый умный тут? Иди нахуй, я сказал. Твой «Ordo ex Chao» уже в печёнках сидит.",
        "Морриган, ты заебал. Иди нахуй. Я не буду платить твои 15 баксов."
      ]
    }
  };

  const names = Object.keys(characters);
  
  const visitorEl = document.getElementById('visitor');
  const faceTextEl = document.getElementById('face-text');
  const speakerEl = document.getElementById('speaker');
  const lineEl = document.getElementById('line');
  const choicesEl = document.getElementById('choices');
  const customRow = document.getElementById('custom-row');
  const customInput = document.getElementById('custom-input');
  const roomEl = document.getElementById('room');

  let currentName = null;
  let currentLine = "";
  let currentSpankCount = 0;
  let busy = false;
  let lastTwo = [];

  let audioCtx;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    try {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.05);
      } 
      else if (type === 'spank') {
        const bufferSize = audioCtx.sampleRate * 0.1;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start(now);
      } 
      else if (type === 'sad') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.6);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.6);
      }
      else if (type === 'angry') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.2);
      }
    } catch(e) {}
  }

  function getRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function getFace(name) {
    const faces = {
      "Джеффри": [":0", ":O", ":|"],
      "Бернадетт": [":P", ":3", ";P"],
      "Альфред": [":|", ":-|", ":Z"],
      "Эвелин": [":3", "^_^", "UwU"],
      "Ваня": [":(", ":/", ":c"],
      "Нетц": [":'(", "T_T", "._."],
      "Владимир": ["T_T", ";-;", "ToT"],
      "Дима": [">:(", ">:|", "ಠ_ಠ"]
    };
    return getRandom(faces[name] || [":0"]);
  }

  function addCoffeeCup() {
    const currentCups = document.querySelectorAll('.coffee-cup').length;
    if (currentCups > 15) return;
    const cup = document.createElement('div');
    cup.className = 'coffee-cup';
    cup.style.left = (5 + Math.random() * 25) + '%';
    cup.style.bottom = (20 + Math.random() * 10) + '%';
    cup.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
    roomEl.appendChild(cup);
  }

  function spawnDummy() {
    busy = false;
    currentSpankCount = 0;
    
    let availableNames = names.filter(name => !lastTwo.includes(name));
    if (availableNames.length === 0) availableNames = names;
    
    currentName = getRandom(availableNames);
    
    lastTwo.push(currentName);
    if (lastTwo.length > 2) lastTwo.shift();

    const charData = characters[currentName];
    currentLine = getRandom(charData.lines);
    
    visitorEl.classList.remove('hidden');
    faceTextEl.textContent = getFace(currentName);
    
    speakerEl.textContent = currentName;
    lineEl.textContent = '«' + currentLine + '»';
    lineEl.scrollTop = 0;

    if (charData.isEvelyn) addCoffeeCup();
    
    renderChoices();
  }

  function hideDummy() {
    visitorEl.classList.add('hidden');
  }

  function renderChoices() {
    choicesEl.innerHTML = '';
    customRow.classList.remove('active');
    customInput.value = '';

    const options = [
      { text: 'Выслушать (молча)', action: 'listen' },
      { text: 'Дать под сраку', action: 'spank' },
      { text: 'Выгнать из кабинета', action: 'fire' },
      { text: 'Сказать своё...', action: 'custom' }
    ];

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.textContent = opt.text;
      btn.onclick = () => handleAction(opt.action);
      choicesEl.appendChild(btn);
    });
  }

  function handleAction(action) {
    if (busy || !currentName) return;
    initAudio();

    if (action === 'custom') {
      playSound('click');
      customRow.classList.add('active');
      customInput.focus();
      return;
    }

    const charData = characters[currentName];
    choicesEl.innerHTML = '';
    
    if (action === 'listen') {
      busy = true;
      playSound('sad');
      
      if (charData.isVisitor) {
        lineEl.textContent = currentName + ' разворачивается и уходит, не дождавшись вашей реакции.';
      } else {
        lineEl.textContent = 'Вы молча киваете. Сотрудник уходит, так и не поняв, что вы его не слушали.';
      }
      
      speakerEl.textContent = '';
      setTimeout(nextVisitor, 3000); 
    } 
    
    else if (action === 'spank') {
      playSound('spank');
      currentSpankCount++;
      visitorEl.classList.add('spank-anim');
      
      if (charData.isDima) {
        busy = false; 
        speakerEl.textContent = 'ДИМА';
        lineEl.textContent = '— Дима посмотрел на вас. Он не ушёл. Он сказал: «Слышь, ты чё, долбанулся? Иди нахуй».';
        setTimeout(() => {
          visitorEl.classList.remove('spank-anim');
          renderChoices(); 
        }, 800);
      } 
      else if (currentSpankCount < 3) {
        busy = false;
        speakerEl.textContent = currentName;
        lineEl.textContent = '— ' + currentName + ' ойкает. «Мистер Морриган, что вы делаете? Это же насилие!»';
        setTimeout(() => {
          visitorEl.classList.remove('spank-anim');
          renderChoices(); 
        }, 800);
      } 
      else {
        busy = true;
        speakerEl.textContent = '';
        lineEl.textContent = 'Вы дали ' + currentName + ' под сраку в третий раз. ' + currentName + ' больше не выдерживает, всхлипывает и убегает.';
        setTimeout(() => { visitorEl.classList.remove('spank-anim'); nextVisitor(); }, 3500);
      }
    } 
    
    else if (action === 'fire') {
      if (charData.isDima) {
        playSound('angry');
        lineEl.textContent = 'Вы попытались выгнать Диму. В ответ он вам набил ебало. Вы ахуели. Дима ушёл сам.';
        speakerEl.textContent = '';
        busy = true;
        setTimeout(() => nextVisitor(), 4000); 
      } else {
        playSound('click');
        busy = true;
        speakerEl.textContent = '';
        lineEl.textContent = 'Вы указываете ' + currentName + ' на дверь. Дверь хлопает.';
        setTimeout(nextVisitor, 3000);
      }
    }
  }

  // --- ИНТЕГРАЦИЯ С НЕЙРОСЕТЬЮ (PUTER.JS) ---
  window.sendCustom = async function() {
    if (busy || !currentName) return;
    const text = customInput.value.trim();
    if (!text) return;
    
    initAudio();
    playSound('click');
    busy = true;
    customRow.classList.remove('active');
    choicesEl.innerHTML = '';
    
    lineEl.innerHTML = '— Вы: «' + text + '»<br><br><span class="typing">Персонаж думает</span>';
    speakerEl.textContent = '';
    
    const charData = characters[currentName];
    
    // Формируем промпт для ИИ
    const systemPrompt = `Ты играешь роль персонажа по имени ${currentName} в текстовом квесте.
Сеттинг: 1922 год, США, Огайо. Бюро Магического Регулирования. Сухой закон. Маги обязаны покупать лицензии.
Твой персонаж: ${charData.desc}
Твоя изначальная фраза была: "${currentLine}"

Сейчас директор Бюро (игрок) говорит тебе: "${text}".

Напиши ответ от лица твоего персонажа. Ответ должен быть коротким (до 25 слов), в характере, органично продолжая твою изначальную мысль.
Если игрок тебя оскорбляет (использует маты, слова вроде 'нахуй', 'долбоёб', 'конченый'), реагируй остро: либо обижайся, либо груби в ответ, в зависимости от твоего характера.
Не используй кавычки в начале и конце, просто напиши текст ответа.`;

    try {
      // Вызов нейросети Puter.js
      const response = await puter.ai.chat(systemPrompt, { model: 'gpt-4o-mini' });
      
      // Выводим ответ
      lineEl.textContent = '— ' + response;
      
      // Звук реакции (грустный или злой в зависимости от текста)
      const lowerText = text.toLowerCase();
      if (lowerText.includes('нахуй') || lowerText.includes('долбо')) {
        playSound('angry');
      } else {
        playSound('sad');
      }
      
      setTimeout(nextVisitor, 4000);
      
    } catch (error) {
      console.error("Ошибка ИИ:", error);
      lineEl.textContent = '— ' + currentName + ' странно смотрит на вас, но ничего не отвечает. (Ошибка подключения к ИИ)';
      setTimeout(nextVisitor, 3000);
    }
  };

  function nextVisitor() {
    hideDummy();
    setTimeout(() => {
      spawnDummy();
    }, 800); 
  }

  setTimeout(spawnDummy, 500);

})();
</script>
</body>
</html>
